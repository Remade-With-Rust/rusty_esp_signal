name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Sibling Janus repos are consumed by git URL and are PRIVATE until each is
  # market-ready. Cargo fetches them through the git CLI, which honours the
  # token rewrite below. Set the repository secret JANUS_GIT_TOKEN to a
  # fine-grained PAT (or GitHub App token) with read access to the siblings.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  JANUS_GIT_TOKEN: ${{ secrets.JANUS_GIT_TOKEN }}

jobs:
  host:
    name: host (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Authorise private sibling fetches
        if: ${{ env.JANUS_GIT_TOKEN != '' }}
        shell: bash
        run: git config --global url."https://x-access-token:${JANUS_GIT_TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # the workspace's members only: `--all` follows path dependencies into
      # vendor/open-mac, which keeps upstream's formatting (its own crates of
      # ours are checked in the `air` job)
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  air:
    # E2 and E3 (the umbrella's docs/plans/e2-air-interface.md and
    # e3-access-point.md): the open MAC's station and access point on the
    # host. vendor/open-mac is outside the workspace, so its crates run here:
    # the station's handshakes (sta_handshake), the access point's logic
    # (ap_core) and host-tests/air (the regressions, the no-panic corpus, the
    # simulated access point, the independent Python check). Not Wi-Fi
    # certified.
    name: air (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - working-directory: vendor/open-mac/sta_handshake
        run: cargo fmt --check
      - working-directory: vendor/open-mac/sta_handshake
        run: cargo clippy --release -- -D warnings
      - working-directory: vendor/open-mac/ap_core
        run: cargo fmt --check
      - working-directory: vendor/open-mac/ap_core
        run: cargo clippy --release -- -D warnings
      # E4: ESP-NOW's frame laid out by hand (the link on raw frames)
      - working-directory: vendor/open-mac/espnow_frame
        run: cargo fmt --check
      - working-directory: vendor/open-mac/espnow_frame
        run: cargo clippy --release -- -D warnings
      # E3: interop.rs checks the access point's handshakes against a second
      # implementation in Python (interop/wpa2.py), which needs `cryptography`
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install cryptography
      - working-directory: vendor/open-mac/host-tests/air
        run: cargo fmt --check
      - working-directory: vendor/open-mac/host-tests/air
        run: cargo clippy --release --all-targets -- -D warnings
      - working-directory: vendor/open-mac/host-tests/air
        run: cargo test --release

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authorise private sibling fetches
        if: ${{ env.JANUS_GIT_TOKEN != '' }}
        shell: bash
        run: git config --global url."https://x-access-token:${JANUS_GIT_TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny
      # Licences, the no-C ban list, advisories and the git allow-list: the
      # posture deny.toml states, checked on every push rather than by hand.
      - run: cargo deny check

  no_std:
    name: no_std (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - riscv32imac-unknown-none-elf   # ESP32-C6 / C61 / H2 class
          - riscv32imafc-unknown-none-elf  # ESP32-P4 class
    steps:
      - uses: actions/checkout@v4
      - name: Authorise private sibling fetches
        if: ${{ env.JANUS_GIT_TOKEN != '' }}
        shell: bash
        run: git config --global url."https://x-access-token:${JANUS_GIT_TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo check -p rusty_esp_signal-core --no-default-features --target ${{ matrix.target }}
      - run: cargo check -p rusty_esp_signal-core --no-default-features --features alloc --target ${{ matrix.target }}

  firmware:
    name: firmware (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - c6-mesh-node
          - c6-lora-p2p
          - c6-ble-provision
          # E4's bench relay (the blob's ESP-NOW <-> serial): crates.io only
          - espnow-relay
          # S1, the link's kill test (its default image is the C6 responder)
          - c6-s1-link
          # E3's four stations: a C6 station on esp-radio (network at build)
          - c6-sta-probe
          # E5's P2/P3: the C6 MAC without libpp, receiving
          - c6-open-rx
    steps:
      - uses: actions/checkout@v4
      - name: Authorise private sibling fetches
        if: ${{ env.JANUS_GIT_TOKEN != '' }}
        shell: bash
        run: git config --global url."https://x-access-token:${JANUS_GIT_TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv32imac-unknown-none-elf
      # Track B on a RISC-V part builds on stable; espup is only for Xtensa.
      - if: ${{ matrix.project != 'c6-sta-probe' }}
        run: cargo build --release
        working-directory: firmware/${{ matrix.project }}
      # the station takes its network at build time: placeholders, no secret
      - if: ${{ matrix.project == 'c6-sta-probe' }}
        run: cargo build --release
        working-directory: firmware/${{ matrix.project }}
        env:
          JANUS_WIFI_SSID: ci-placeholder
          JANUS_WIFI_PASS: ci-placeholder-not-a-secret
      # S1's other half, from the same source
      - if: ${{ matrix.project == 'c6-s1-link' }}
        run: cargo build --release --no-default-features --features role-initiator,chip-esp32c6
        working-directory: firmware/${{ matrix.project }}

  # Track B on the S3 (Xtensa): the esp toolchain from espup, no ESP-IDF.
  firmware-xtensa:
    name: firmware (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - xiao-s3-sense-hal-ble-provision
          # the link on raw frames on the open MAC (E4); its image is E6's
          # gate: at most esp-radio's 5 dBm, none of esp-radio
          - xiao-s3-open-link
          # the setup page on an open network from the open MAC (E7): the
          # same gate
          - xiao-s3-open-setup
    steps:
      - uses: actions/checkout@v4
      - name: Authorise private sibling fetches
        if: ${{ env.JANUS_GIT_TOKEN != '' }}
        shell: bash
        run: git config --global url."https://x-access-token:${JANUS_GIT_TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: esp-rs/xtensa-toolchain@v1.5
        with:
          default: true
          buildtargets: esp32s3
          # ldproxy links an ESP-IDF app. This is bare metal and does not
          # need it; installing it would only cost time.
          ldproxy: false
      # `build-std = ["core", "alloc"]` in the firmware's .cargo/config.toml
      # needs rust-src, which the action above installs.
      - run: cargo build --release
        working-directory: firmware/${{ matrix.project }}
      # E6's gate: the same link again with a linker map, then the image and
      # the map checked (at most 5 dBm, none of esp-radio, no C but the PHY)
      - if: ${{ startsWith(matrix.project, 'xiao-s3-open-') }}
        working-directory: firmware/${{ matrix.project }}
        run: cargo rustc --release --bin ${{ matrix.project }} -- -C link-arg=-Wl,-Map=${{ github.workspace }}/open-mac.map
      - if: ${{ startsWith(matrix.project, 'xiao-s3-open-') }}
        run: python3 tools/open-mac-image-check.py firmware/${{ matrix.project }}/target/xtensa-esp32s3-none-elf/release/${{ matrix.project }} --map open-mac.map
