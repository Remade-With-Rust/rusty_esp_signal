[package]
name = "rusty_esp_signal-esp"
description = "Chip backends for rusty_esp_signal: the WRAP crate. `esp-hal` (Track B, no_std + Embassy) or `esp-idf` (Track A, std on ESP-IDF). The only crate in the workspace allowed a fenced unsafe block, and only at a DMA or FFI boundary."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "README.md"
documentation = "https://docs.rs/rusty_esp_signal-esp"
keywords = ["esp32", "embedded", "esp-hal", "esp-idf", "remade-with-rust"]
categories = ["embedded", "no-std", "hardware-support"]

[features]
default = []
std = ["rusty_esp_signal-core/std"]
alloc = ["rusty_esp_signal-core/alloc"]
# Track B — bare metal: esp-hal + Embassy. The chip feature (esp32c6, …) is
# selected by the FIRMWARE, never here: esp-hal refuses to build without exactly
# one, and a library that picked one would fix the chip for every consumer. So
# this crate is compiled only as part of a firmware, which supplies the chip.
esp-hal = ["alloc", "dep:esp-hal", "dep:embassy-time"]
# The link's HMAC on the chip's SHA accelerator (`hal::sha::EspSha`, round 2
# R3): ten times faster a block than software on an S3. Every chip but the
# original ESP32, whose SHA unit cannot resume from a midstate; a firmware
# for that chip leaves this off.
sha-accel = ["esp-hal"]
# The esp-radio backends (CSI, the ESP-NOW link, the station policy). Separate
# from `esp-hal` because esp-radio needs the firmware's chip feature and pulls
# the Wi-Fi/BLE blobs: a LoRa-only or LD2410-only firmware must not pay for it.
esp-radio = ["esp-hal", "dep:esp-radio", "dep:embassy-futures"]
# An IP stack over the station (`hal::netstack`): embassy-net over esp-radio's
# station interface, DHCP, UDP and TCP sockets -- what `wifi-sta` means on a
# bare-metal chip (killing-C plan, X2). Its own feature because it brings
# smoltcp, which an ESP-NOW-only or CSI-only node never needs.
# The mID link over UDP on any embassy-net stack (esp-radio's or the open
# MAC's, E3): `hal::link::UdpLink` without the ESP-NOW half or esp-radio.
udp-link = ["esp-hal", "dep:embassy-net"]
embassy-net = ["esp-radio", "udp-link", "dep:embassy-executor"]
# The board hosting its own network (`hal::netstack`'s access point half):
# the DHCP server embassy-net does not have, from edge-dhcp over edge-nal's
# UDP binding to embassy-net. What `access_point = true` means on a bare-metal
# chip (killing-C plan, X5: the page measured with no router in the line).
access-point = ["embassy-net", "dep:edge-dhcp", "dep:edge-nal", "dep:edge-nal-embassy"]
# LoRa (lora-phy) and BLE (trouble-host) touch no esp crate at all — they are
# generic over the modem and the HCI controller — so they stand alone and a
# firmware can take one without the radio stack.
lora = ["alloc", "dep:lora-phy"]
ble = ["alloc", "dep:trouble-host", "dep:bt-hci", "dep:embassy-sync", "dep:embassy-futures", "dep:embassy-time", "dep:static_cell", "dep:heapless"]
# Track A — std on ESP-IDF via esp-idf-svc. Compiled only as part of an
# ESP-IDF firmware (esp-idf-sys needs the IDF build); the CSI, ESP-NOW and
# LoRa radios stay Track B for now. On its own this brings the backends that
# need nothing of the IDF beyond a peripheral — today the LD2410 reader.
esp-idf = ["std", "dep:esp-idf-svc", "dep:log"]
# BLE provisioning over Bluedroid (`idf::ble`), the same GATT contract as
# `ble` on Track B. Separate from `esp-idf` because esp-idf-svc compiles its
# `bt` module out unless the firmware's sdkconfig sets CONFIG_BT_ENABLED: a
# radar-only Track A firmware has no Bluetooth and must not ask for this.
esp-idf-ble = ["esp-idf", "dep:enumset"]
# Wi-Fi CSI on ESP-IDF (`idf::csi`): the Track A twin of `hal::csi`, so a
# camera or mesh cell can watch the room on the same board. Its own feature
# because it registers a C callback on the Wi-Fi task through raw ESP-IDF
# entry points -- the crate's one `allow(unsafe_code)` seam -- and a firmware
# with no Wi-Fi sensing has no reason to carry it.
esp-idf-csi = ["esp-idf"]

[dependencies]
rusty_esp_signal-core = { workspace = true }

# Track B — all optional, pulled in only by the features above. No chip feature
# here (see the `esp-hal` feature note). esp-radio's radio features ARE set
# here (they are chip-independent): the backends this crate ships need them.
# A RANGE, not an exact pin, and the distinction is the whole companion-set
# rule. A firmware must never MIX companion sets -- but it is the firmware
# that picks which set, and an `=` pin in a library takes that choice away
# from every consumer at once. This crate said `=1.1.2`, so a C6 firmware
# could not move to the 1.2 line without the library moving too, and the S3
# firmwares were already there: one library, two incompatible truths.
#
# K5 forced the issue: `esp-rtos` 0.4 requires esp-hal `~1.2.0-rc.0`, so the
# Kairos port cannot go under a firmware this crate has pinned to 1.1.2.
esp-hal = { version = "1.1", default-features = false, features = ["unstable"], optional = true }
# Caret, not `=`, for the same reason as esp-hal above. A caret on a
# PRE-RELEASE is still narrow: `1.0.0-beta.0` admits later betas of 1.0.0 and
# nothing beyond, which is exactly the latitude a firmware needs to pick its
# companion set without the library re-pinning.
#
# `trouble-host` and `lora-phy` below still carry `=` pins. Same pattern, and
# they should move the same way -- but they are the BLE and LoRa firmwares'
# dependencies, not the mesh node's, so they move when those firmwares do and
# can be verified on the radios they drive.
esp-radio = { version = "1.0.0-beta.0", default-features = false, features = ["wifi", "esp-now", "csi", "ble", "unstable"], optional = true }
embassy-time = { version = "0.5", optional = true }
embassy-futures = { version = "0.1", optional = true }
# embassy-net 0.9 is the line that takes esp-radio's `embassy-net-driver` 0.2
# interface. The feature set is the smallest that gives a station an address
# and two socket kinds, plus the ICMP echo reply that is opt-in here and
# built into lwIP: a bench pings the board before it streams (V1 recorded
# the RTT), and a board that does not answer looks absent. A firmware that
# wants DNS or IPv6 adds them itself.
embassy-net = { version = "0.9", default-features = false, features = ["proto-ipv4", "dhcpv4", "udp", "tcp", "medium-ethernet", "auto-icmp-echo-reply"], optional = true }
# For the `#[task]` attribute on the stack runner and the station keeper.
embassy-executor = { version = "0.10", optional = true }
# The DHCP server for a hosted network: edge-dhcp's packet server run over
# edge-nal's UDP traits, which edge-nal-embassy implements on embassy-net 0.9.
# Only the features the server needs; edge-nal-embassy's defaults would turn
# on DNS, IPv6 and ICMP in embassy-net.
edge-dhcp = { version = "0.8", default-features = false, features = ["io"], optional = true }
edge-nal = { version = "0.7", optional = true }
edge-nal-embassy = { version = "0.9", default-features = false, features = ["proto-ipv4", "udp", "medium-ethernet"], optional = true }
# trouble-host 0.7 is the line that speaks bt-hci 0.9, which esp-radio
# 1.0.0-beta.1 (the 1.2 companion set) hands out; 0.6 / bt-hci 0.8 was the
# beta.0 set's. A caret, as for esp-hal above: the firmware picks the set.
# `att-queued-writes`: a setup message longer than one ATT packet arrives as
# a prepared (long) write, assembled in trouble-host's 512-byte buffer and
# handed over whole at offset 0 (enc-ble M5; protocol section 11.1).
trouble-host = { version = "0.7", default-features = false, features = ["gatt", "peripheral", "derive", "default-packet-pool", "att-queued-writes"], optional = true }
# The `setup` and `discover` values are variable-length: `heapless::Vec`, the
# type trouble-host serves at its own length (a fixed array would hand the
# browser trailing zeros).
heapless = { version = "0.9", default-features = false, optional = true }
bt-hci = { version = "0.9", default-features = false, optional = true }
# The trouble-host GATT macros expand to references to these two crates, so a
# crate that invokes them must depend on them by name.
embassy-sync = { version = "0.7", optional = true }
static_cell = { version = "2", optional = true }
lora-phy = { version = "=3.0.1", optional = true }

# Track A — pulled in by `esp-idf` only.
esp-idf-svc = { version = "0.52", default-features = false, features = ["std", "alloc"], optional = true }
enumset = { version = "1", optional = true }
log = { version = "0.4", optional = true }

[lints]
workspace = true
