[package]
name = "rusty_esp_signal-core"
description = "The pure no_std + alloc core of rusty_esp_signal: types, traits and algorithms with no drivers, no allocator and no product types. forbid(unsafe)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "README.md"
documentation = "https://docs.rs/rusty_esp_signal-core"
keywords = ["esp32", "embedded", "no-std", "mata", "remade-with-rust"]
categories = ["embedded", "no-std", "hardware-support"]

[features]
default = ["std"]
# The feature ladder is the rusty_zstd one: `std` implies `alloc`; with neither,
# the crate is pure `core` and still builds on riscv32 bare metal.
std = ["alloc", "rusty_esp_core/std", "rusty_esp_dsp/std", "rusty_esp_mid-core/std", "p256/std", "sha2/std", "zeroize/std"]
alloc = ["rusty_esp_core/alloc", "rusty_esp_dsp/alloc", "rusty_esp_mid-core/alloc", "p256/alloc", "zeroize/alloc"]
# The setup page a device serves at `/` on its open setup network (E7,
# protocol section 11.2), gzipped (`setup::page::SETUP_PAGE_GZ`, ~76 KB of
# flash): the page's wasm and session script, built by
# tools/build-provision-page.py. Only a firmware that hosts it turns it on.
setup-page = []

[dependencies]
rusty_esp_core = { workspace = true }
rusty_esp_dsp = { workspace = true }
rusty_esp_mid-core = { workspace = true }
# `ecdsa`: the setup session verifies the device's signature in the browser.
p256 = { workspace = true, features = ["ecdsa"] }
# `compress`: the bare block function, which the link's HMAC runs through
# a `Sha256Blocks` engine (round 2, R3).
sha2 = { workspace = true, features = ["compress"] }
hmac = { workspace = true }
hkdf = { workspace = true }
zeroize = { workspace = true }
chacha20poly1305 = { workspace = true }
subtle = { workspace = true }

[lints]
workspace = true
