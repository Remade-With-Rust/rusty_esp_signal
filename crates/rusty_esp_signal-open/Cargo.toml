[package]
name = "rusty_esp_signal-open"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
# Not on crates.io: it depends on the vendored open MAC by path
# (vendor/open-mac), which crates.io refuses. Cells take it by git URL.
publish = false
description = "Experiments plan E1, E3 and E4: the Wi-Fi station, the access point and the mID link on raw ESP-NOW frames, on the open lower MAC (esp-wifi-hal + FoA, vendored) for the ESP32-S3, in the shape of rusty_esp_signal-esp's hal. libphy is the one radio blob. NOT Wi-Fi certified."

[features]
default = []
# The ESP32-S3, the one chip the open MAC is ported for here. A firmware
# turns this on; without it the crate is empty (the workspace's host build
# and tests never compile the radio). It names the chip on the vendored
# crates, which only build for the S3.
esp32s3 = [
    "dep:esp-hal",
    "dep:embassy-net",
    "dep:embassy-executor",
    "dep:embassy-time",
    "dep:static_cell",
    "dep:esp-wifi-hal",
    "dep:foa",
    "dep:foa_sta",
    "dep:ap_core",
    "dep:sta_handshake",
    "dep:ieee80211",
    "dep:embassy-futures",
    "dep:embassy-net-driver",
    "dep:embassy-net-driver-channel",
    "dep:edge-dhcp",
    "dep:edge-nal",
    "dep:edge-nal-embassy",
    "dep:espnow_frame",
    "dep:embassy-sync",
    "esp-hal/esp32s3",
    "esp-wifi-hal/esp32s3",
    "foa/esp32s3",
    "foa_sta/esp32s3",
]

[dependencies]
rusty_esp_signal-core = { workspace = true }
esp-hal = { version = "=1.2.0", default-features = false, features = ["unstable"], optional = true }
embassy-net = { version = "0.9", default-features = false, features = ["proto-ipv4", "dhcpv4", "udp", "tcp", "medium-ethernet", "auto-icmp-echo-reply"], optional = true }
embassy-executor = { version = "0.10", optional = true }
embassy-time = { version = "0.5", optional = true }
static_cell = { version = "2", optional = true }
esp-wifi-hal = { path = "../../vendor/open-mac/esp-wifi-hal", optional = true }
foa = { path = "../../vendor/open-mac/foa", optional = true }
foa_sta = { path = "../../vendor/open-mac/foa_sta", optional = true }
# the access point (E3): its decisions in ap_core, the station-side key
# types it shares, the PMK from ieee80211's PBKDF2, the Ethernet device
# between the air and embassy-net, and the DHCP server a laptop expects
ap_core = { path = "../../vendor/open-mac/ap_core", optional = true }
sta_handshake = { path = "../../vendor/open-mac/sta_handshake", optional = true }
ieee80211 = { version = "0.5.9", path = "../../vendor/open-mac/ieee80211", default-features = false, features = ["crypto"], optional = true }
embassy-futures = { version = "0.1", optional = true }
embassy-net-driver = { version = "0.2", optional = true }
embassy-net-driver-channel = { version = "0.4", optional = true }
edge-dhcp = { version = "0.8", default-features = false, features = ["io"], optional = true }
edge-nal = { version = "0.7", optional = true }
edge-nal-embassy = { version = "0.9", default-features = false, features = ["proto-ipv4", "udp", "medium-ethernet"], optional = true }
# the link on raw frames (E4): ESP-NOW's frame laid out by hand, and the
# queue between the radio's task and the link's
espnow_frame = { path = "../../vendor/open-mac/espnow_frame", optional = true }
embassy-sync = { version = "0.8", optional = true }

[lints]
workspace = true
