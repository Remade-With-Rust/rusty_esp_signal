crate: foa

options:
  - name: rx_buffer_count
    description: Amount of RX buffers
    default: 
      - value: 8
    constraints:
      - type:
          validator: positive_integer
  - name: rx_queue_len
    description: Length of the RX queue
    default:
      - value: 2
    constraints:
      - type:
          validator: positive_integer
  - name: tx_buffer_size
    description: Size of a TX buffer in bytes (Janus E8; 3885 holds an A-MSDU of two full-size packets)
    default:
      - value: 1600
    constraints:
      - type:
          validator: positive_integer
  - name: tx_buffer_count
    description: Amount of TX buffers
    default: 
      - value: 8
    constraints:
      - type:
          validator: positive_integer
