[package]
name = "esp32s3-wifi-regs"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "The ESP32-S3 Wi-Fi MAC register block (opensensor/esp-pacs 37b54bd, esp-rs/esp-pacs#511) over the generic types of the esp32s3 PAC esp-hal 1.2 uses. Not Wi-Fi certified."

[dependencies]
# esp-hal 1.2.0's PAC: its `Interrupt` enum. The generic register types are
# copied from the same release (src/generic*.rs): svd2rust writes inherent
# impls on them, which only the defining crate may.
esp32s3 = { version = "0.36", default-features = false }
vcell = "0.1.3"

[lib]
path = "src/lib.rs"
