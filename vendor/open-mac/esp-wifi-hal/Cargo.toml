[package]
name = "esp-wifi-hal"
version = "0.3.3"
authors = ["Frostie314159 <frostie.neuenhausen@gmail.com>"]
edition = "2024"
license = "MIT OR Apache-2.0"
readme = "README.md"
description = "An experimental driver for the Wi-Fi peripheral on ESP32-series chips."
homepage = "https://github.com/opensensor/esp-wifi-hal"
repository = "https://github.com/opensensor/esp-wifi-hal"

[dependencies]
# The family's pins (E1, H2): esp-hal 1.2.0 and the esp-phy / esp-wifi-sys /
# esp-sync it pairs with. Upstream at f159fcf: esp-hal 1.1.1, esp-phy 0.2.0,
# esp-wifi-sys 0.2.0, esp-sync 0.2.
esp-hal = { version = "=1.2.0", features = ["unstable"] }
# vendored beside this crate: the PHY's maximum transmit power is an option
# there (E6), matched to esp-radio's 5 dBm by default
esp-phy = { path = "../esp-phy" }
esp-sync = "0.3.0"

# The S3 only (upstream also carried the ESP32, S2 and C3).
esp32s3-wifi-regs = { path = "../esp32s3-wifi-regs", optional = true }
esp-wifi-sys-esp32s3 = { version = "=0.3.0", optional = true }

# Embassy dependencies
embassy-futures = "0.1.2"
embassy-sync = "0.8.0"
embassy-time = "0.5.0"

static_cell = { version = "2.1.1" }
macro-bits = "0.1.5"
portable-atomic = { version = "1.13.1", default-features = false }
defmt-or-log = { version = "0.2.3", default-features = false }
defmt = { version = "1.0.1", optional = true }
bitfield-struct = "0.13.0"
log = { version = "0.4.28", optional = true }
critical-section = "1.2.0"
num = { version = "0.4.3", default-features = false }
esp-wifi-rates = { version = "0.1.0" }

[features]
rx-probe = []
esp32s3 = [
  "dep:esp32s3-wifi-regs",
  "esp-hal/esp32s3",
  "esp-wifi-sys-esp32s3",
  "esp-phy/esp32s3",
  "esp-sync/esp32s3",
]
defmt = [
  "dep:defmt",
  "defmt-or-log/defmt",
  "esp-phy/defmt",
  "esp-sync/defmt",
  "esp-wifi-rates/defmt",
]
log = ["dep:log", "defmt-or-log/log", "esp-phy/log-04", "esp-sync/log-04"]
critical_section = []
# Optional in-memory latency counters; no output in interrupt/packet paths.
timing-probe = []

