[package]
name = "foa_sta"
version = "0.2.0"
authors = ["Frostie314159 <frostie.neuenhausen@gmail.com>"]
edition = "2024"
license = "MIT OR Apache-2.0"
readme = "../README.md"
description = "A station mode implementation for Ferris-on-Air."
homepage = "https://esp32-open-mac.be/"
repository = "https://github.com/esp32-open-mac/FoA"

[dependencies]
esp-config = "0.8.0"
esp-hal = { version = "=1.2.0", features = ["unstable"] }

embassy-futures = "0.1.2"
embassy-net-driver-channel = "0.4.0"
embassy-sync = "0.8.0"
embassy-time = "0.5.1"

foa = { version = "0.2.0", path = "../foa/" }

ethernet = { version = "0.1.6", default-features = false }
heapless = { version = "0.9.3" }
llc-rs = "0.1.3"
embassy-net-driver = "0.2.0"

portable-atomic = { version = "1.15.0", default-features = false }
ieee80211 = "0.5.9"
log = { version = "0.4.33", optional = true }
defmt = { version = "1.1.1", optional = true }
defmt-or-log = { version = "0.2.3", default-features = false }
futures-util = { version = "0.3.34", default-features = false }

[build-dependencies]
esp-config = { version = "0.8.0", features = ["build"] }

[features]
# The S3 only (E1, H2; upstream: esp32, esp32s2)
esp32s3 = ["foa/esp32s3", "esp-hal/esp32s3"]
default = ["alloc", "wpa2"]
rsn = ["ieee80211/crypto"]
wpa2 = ["rsn"]

alloc = []


log = ["dep:log", "foa/log", "defmt-or-log/log"]
defmt = ["dep:defmt", "defmt-or-log/defmt", "foa/defmt", "ieee80211/defmt"]
