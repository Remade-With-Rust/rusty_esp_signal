[package]
name = "ap_core"
version = "0.1.0"
edition = "2024"
publish = false
description = "The open MAC's access point as pure functions: frames laid out from 802.11, the station table and association, WPA2-PSK's authenticator (Janus E3 P2). Not Wi-Fi certified."
license = "MIT OR Apache-2.0"

[dependencies]
ieee80211 = { version = "0.5.9", path = "../ieee80211", default-features = false, features = ["crypto"] }
# CCMP in software (src/ccmp.rs): the block cipher only, CCM is built here.
# 0.8 is the version `ieee80211`'s aes-kw already brings, so one AES in flash.
aes = { version = "0.8.4", default-features = false }
llc-rs = "0.1.3"
sta_handshake = { path = "../sta_handshake" }
