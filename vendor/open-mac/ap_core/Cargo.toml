[package]
name = "ap_core"
version = "0.1.0"
edition = "2024"
publish = false
description = "The open MAC's access point as pure functions: frames laid out from 802.11, the station table and association, WPA2-PSK's authenticator (Janus E3 P2). Not Wi-Fi certified."
license = "MIT OR Apache-2.0"

[dependencies]
ieee80211 = { version = "0.5.9", path = "../ieee80211", default-features = false, features = ["crypto"] }
llc-rs = "0.1.3"
sta_handshake = { path = "../sta_handshake" }
