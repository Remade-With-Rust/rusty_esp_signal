[package]
name = "c6-sta-probe"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "E3's four stations: an ESP32-C6 station on esp-radio that joins the network named at build time, takes a lease, and fetches the access point's page every second, saying how it goes."
license = "MIT OR Apache-2.0"

[[bin]]
name = "c6-sta-probe"
path = "src/main.rs"
test = false
bench = false
doctest = false

[dependencies]
esp-hal = { version = "=1.2.0", features = ["esp32c6", "unstable", "rt"] }
esp-radio = { version = "=1.0.0-beta.1", features = ["esp32c6", "wifi", "unstable"] }
esp-rtos = { version = "=0.4.0", features = ["esp32c6", "esp-radio", "embassy"] }
esp-alloc = { version = "=0.11.0", features = ["esp32c6"] }
esp-bootloader-esp-idf = { version = "=0.6.0", features = ["esp32c6"] }
# UART: the C6 DevKitC's UART socket is the bench's console (as c6-s1-link)
esp-println = { version = "=0.18.0", default-features = false, features = ["esp32c6", "uart"] }
esp-backtrace = { version = "=0.20.0", features = ["esp32c6", "panic-handler", "println"] }
embassy-executor = "0.10"
embassy-time = "0.5"
embassy-net = { version = "0.9", default-features = false, features = ["proto-ipv4", "dhcpv4", "tcp", "medium-ethernet"] }
embedded-io-async = "0.7"
static_cell = "2"

rusty_esp_signal-core = { path = "../../crates/rusty_esp_signal-core", default-features = false, features = ["alloc"] }
rusty_esp_signal-esp = { path = "../../crates/rusty_esp_signal-esp", default-features = false, features = ["esp-radio", "embassy-net"] }
rusty_esp_core = { git = "https://github.com/Remade-With-Rust/rusty_esp_core", version = "0.1", default-features = false, features = ["alloc"] }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"

[workspace]
