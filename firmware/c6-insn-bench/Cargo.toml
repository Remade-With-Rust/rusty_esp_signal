[package]
name = "c6-insn-bench"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "The experiments' portable code counted on silicon: retired instructions per call of ap_core's frames, parser, station table, hold pool and handshake, and c6-open-rx's sniffer, on an ESP32-C6 (its performance counter, interrupts masked), each with an FNV of its output as the byte-identity gate."
license = "MIT OR Apache-2.0"

[[bin]]
name = "c6-insn-bench"
path = "src/main.rs"
test = false
bench = false
doctest = false

[dependencies]
esp-hal = { version = "=1.2.0", features = ["esp32c6", "unstable", "rt"] }
esp-alloc = { version = "=0.11.0", features = ["esp32c6"] }
esp-bootloader-esp-idf = { version = "=0.6.0", features = ["esp32c6"] }
esp-println = { version = "=0.18.0", default-features = false, features = ["esp32c6", "uart"] }
esp-backtrace = { version = "=0.20.0", features = ["esp32c6", "panic-handler", "println"] }
critical-section = "1"
ap_core = { path = "../../vendor/open-mac/ap_core" }
ieee80211 = { path = "../../vendor/open-mac/ieee80211", default-features = false, features = ["crypto"] }
sta_handshake = { path = "../../vendor/open-mac/sta_handshake" }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 2

[workspace]
