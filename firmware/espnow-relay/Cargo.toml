[package]
name = "espnow-relay"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "E4's bench relay: a board on the blob's ESP-NOW that passes every datagram between the air and its serial port, so a bridge on the laptop reaches a node on the open MAC without the laptop's Wi-Fi. It holds no key and reads no frame. Track B (no_std/esp-hal + esp-radio)."
license = "MIT OR Apache-2.0"

[[bin]]
name = "espnow-relay"
path = "src/main.rs"
test = false
bench = false
doctest = false

[features]
default = ["chip-esp32c6"]
chip-esp32c6 = [
  "esp-hal/esp32c6", "esp-radio/esp32c6", "esp-rtos/esp32c6",
  "esp-bootloader-esp-idf/esp32c6", "esp-println/esp32c6", "esp-println/uart", "esp-backtrace/esp32c6",
]
chip-esp32s3 = [
  "esp-hal/esp32s3", "esp-radio/esp32s3", "esp-rtos/esp32s3",
  "esp-bootloader-esp-idf/esp32s3", "esp-println/esp32s3", "esp-println/auto", "esp-backtrace/esp32s3",
]
chip-esp32 = [
  "esp-hal/esp32", "esp-radio/esp32", "esp-rtos/esp32",
  "esp-bootloader-esp-idf/esp32", "esp-println/esp32", "esp-println/uart", "esp-backtrace/esp32",
]

[dependencies]
esp-hal = { version = "=1.2.0", features = ["unstable", "rt"] }
esp-radio = { version = "=1.0.0-beta.1", features = ["wifi", "esp-now", "unstable"] }
esp-rtos = { version = "=0.4.0", features = ["esp-radio", "embassy"] }
esp-alloc = "=0.11.0"
esp-bootloader-esp-idf = "=0.6.0"
# No critical section around a print: the serial receive interrupt must run
# while a line is going out (only the main loop prints).
# The console per chip (the chip features above): UART on the C6 (its
# DevKitC's UART socket; `auto` there sent prints to the unattached native
# USB part-way through, 2026-10-07) and the ESP32, `auto` on the S3.
esp-println = { version = "=0.18.0", default-features = false }
critical-section = "1"
esp-backtrace = { version = "=0.20.0", features = ["panic-handler", "println"] }
embassy-executor = "0.10"
embassy-time = "0.5"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"

[workspace]
