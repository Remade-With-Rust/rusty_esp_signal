[package]
name = "c6-apsta-probe"
version = "0.0.0"
edition = "2024"
publish = false
description = "Probe: an ESP32-C6 as a WPA2 station and a WPA2 access point at once, on esp-radio, with a DHCP server on the hosted network -- whether the vendor's radio does what the open MAC will not. Not Wi-Fi certified."

[[bin]]
name = "c6-apsta-probe"
path = "src/main.rs"
test = false
bench = false
doctest = false

[dependencies]
esp-hal = { version = "=1.2.0", features = ["esp32c6", "unstable", "rt"] }
esp-radio = { version = "=1.0.0-beta.1", features = ["esp32c6", "wifi", "unstable"] }
esp-rtos = { version = "=0.4.0", features = ["esp32c6", "esp-radio", "embassy"] }
esp-alloc = { version = "=0.11.0", features = ["esp32c6"] }
esp-bootloader-esp-idf = { version = "=0.6.0", features = ["esp32c6"] }
# UART: the C6 DevKitC's UART socket is the bench's console (as c6-sta-probe)
esp-println = { version = "=0.18.0", default-features = false, features = ["esp32c6", "uart"] }
esp-backtrace = { version = "=0.20.0", features = ["esp32c6", "panic-handler", "println"] }
embassy-executor = "0.10"
embassy-time = "0.5"
# udp for the DHCP server the hosted network needs; no dhcpv4 client feature
# is dropped, the station half still takes a lease
embassy-net = { version = "0.9", default-features = false, features = ["proto-ipv4", "dhcpv4", "udp", "tcp", "medium-ethernet"] }
static_cell = "2"

rusty_esp_signal-core = { path = "../../crates/rusty_esp_signal-core", default-features = false, features = ["alloc"] }
rusty_esp_signal-esp = { path = "../../crates/rusty_esp_signal-esp", default-features = false, features = ["esp-radio", "embassy-net", "access-point"] }
rusty_esp_core = { git = "https://github.com/Remade-With-Rust/rusty_esp_core", version = "0.1", default-features = false, features = ["alloc"] }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"

[workspace]
