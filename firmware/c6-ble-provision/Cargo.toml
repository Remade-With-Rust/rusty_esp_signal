[package]
name = "c6-ble-provision"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "Janus J4 firmware, Track B (no_std/esp-hal), ESP32-C6: BLE provisioning over the setup session — the core's GATT table served over trouble-host, the session carried to rusty_esp_signal-core, the settings and the device key in NVS."

[[bin]]
name = "c6-ble-provision"
path = "src/main.rs"
test = false
bench = false
doctest = false

[dependencies]
esp-hal = { version = "=1.2.0", features = ["esp32c6", "unstable", "rt"] }
esp-radio = { version = "=1.0.0-beta.1", features = ["esp32c6", "ble", "unstable"] }
esp-rtos = { version = "=0.4.0", features = ["esp32c6", "esp-radio", "embassy"] }
esp-alloc = "=0.11.0"
esp-bootloader-esp-idf = { version = "=0.6.0", features = ["esp32c6"] }
# UART: the C6 DevKitC's UART socket is the bench's console (as c6-s1-link)
esp-println = { version = "=0.18.0", default-features = false, features = ["esp32c6", "uart", "colors", "critical-section"] }
esp-backtrace = { version = "=0.20.0", features = ["esp32c6", "panic-handler", "println"] }
embassy-executor = "0.10"
embassy-time = "0.5"
embassy-futures = "0.1"
trouble-host = { version = "0.7", features = ["gatt", "peripheral"] }
bt-hci = "0.9"
static_cell = "2"

# The SPI flash through the ROM's routines, in Rust: the settings' and the
# identity's home.
esp-storage = { version = "=0.10.0", features = ["esp32c6"] }

rusty_esp_signal-core = { path = "../../crates/rusty_esp_signal-core", default-features = false, features = ["alloc"] }
rusty_esp_signal-esp = { path = "../../crates/rusty_esp_signal-esp", default-features = false, features = ["ble"] }
rusty_esp_core = { git = "https://github.com/Remade-With-Rust/rusty_esp_core", version = "0.1", default-features = false, features = ["alloc"] }
# The device key, and the Track B seams it lives behind: the partition table,
# a partition as NVS flash, the TRNG. Siblings by git URL (the repo's
# .cargo/config.toml patches them to local checkouts).
rusty_esp_mid-core = { git = "https://github.com/Remade-With-Rust/rusty_esp_mid", default-features = false, features = ["alloc"] }
rusty_esp_mid-esp = { git = "https://github.com/Remade-With-Rust/rusty_esp_mid", default-features = false, features = ["esp-hal"] }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"

[workspace]
